<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>书签整理助手 - 图标生成器</title>
  <style>
    body { font-family: system-ui; padding: 30px; background: #f5f5f5; }
    .icon-row { display: flex; align-items: center; gap: 20px; margin: 16px 0; padding: 16px; background: #fff; border-radius: 8px; }
    canvas { border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { padding: 8px 16px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #357abd; }
    h1 { color: #333; }
    p { color: #666; }
  </style>
</head>
<body>
  <h1>书签整理助手 - 图标生成</h1>
  <p>点击"下载"按钮保存图标，或右键图片另存为</p>

  <div id="icons"></div>

  <script>
  function drawIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const s = size;

    // 圆角背景 - 渐变
    const r = s * 0.18;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(s - r, 0);
    ctx.quadraticCurveTo(s, 0, s, r);
    ctx.lineTo(s, s - r);
    ctx.quadraticCurveTo(s, s, s - r, s);
    ctx.lineTo(r, s);
    ctx.quadraticCurveTo(0, s, 0, s - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();

    // 渐变背景
    const grad = ctx.createLinearGradient(0, 0, s, s);
    grad.addColorStop(0, '#667eea');
    grad.addColorStop(1, '#764ba2');
    ctx.fillStyle = grad;
    ctx.fill();

    // 内阴影效果（模拟）
    ctx.save();
    ctx.clip();
    const innerGrad = ctx.createLinearGradient(0, 0, 0, s);
    innerGrad.addColorStop(0, 'rgba(255,255,255,0.15)');
    innerGrad.addColorStop(0.5, 'rgba(255,255,255,0)');
    innerGrad.addColorStop(1, 'rgba(0,0,0,0.1)');
    ctx.fillStyle = innerGrad;
    ctx.fillRect(0, 0, s, s);
    ctx.restore();

    const cx = s / 2;
    const cy = s / 2;

    // 书签主体 - 两个重叠的书签形状
    ctx.fillStyle = 'rgba(255,255,255,0.95)';

    // 后面的书签（偏右偏下）
    const offset = s * 0.08;
    drawBookmark(ctx, cx + offset, cy + offset * 0.5, s * 0.32, s * 0.44);

    // 前面的书签
    ctx.fillStyle = '#fff';
    drawBookmark(ctx, cx - offset * 0.3, cy - offset * 0.5, s * 0.32, s * 0.44);

    // 书签上的排序箭头
    const arrowX = cx - offset * 0.3;
    const arrowY = cy - offset * 0.5;
    const aw = s * 0.12;

    ctx.strokeStyle = '#667eea';
    ctx.lineWidth = Math.max(s * 0.03, 1.5);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 上箭头
    ctx.beginPath();
    ctx.moveTo(arrowX - aw * 0.6, arrowY + s * 0.02);
    ctx.lineTo(arrowX - aw * 0.6, arrowY - s * 0.08);
    ctx.lineTo(arrowX - aw * 0.9, arrowY - s * 0.03);
    ctx.moveTo(arrowX - aw * 0.6, arrowY - s * 0.08);
    ctx.lineTo(arrowX - aw * 0.3, arrowY - s * 0.03);
    ctx.stroke();

    // 横线（3条）
    const lineY = arrowY + s * 0.06;
    for (let i = 0; i < 3; i++) {
      const y = lineY + i * s * 0.05;
      const w = (3 - i) * s * 0.04;
      ctx.beginPath();
      ctx.moveTo(arrowX - aw * 0.6, y);
      ctx.lineTo(arrowX + aw * 0.2 + w, y);
      ctx.stroke();
    }

    // 右下角小勾号
    const checkX = cx + s * 0.12;
    const checkY = cy + s * 0.12;
    const checkR = s * 0.08;

    ctx.beginPath();
    ctx.arc(checkX, checkY, checkR, 0, Math.PI * 2);
    ctx.fillStyle = '#4ade80';
    ctx.fill();

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(s * 0.025, 1);
    ctx.beginPath();
    ctx.moveTo(checkX - checkR * 0.4, checkY);
    ctx.lineTo(checkX - checkR * 0.05, checkY + checkR * 0.35);
    ctx.lineTo(checkX + checkR * 0.45, checkY - checkR * 0.3);
    ctx.stroke();

    return canvas;
  }

  function drawBookmark(ctx, cx, cy, w, h) {
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy - h / 2);
    ctx.lineTo(cx + w / 2, cy - h / 2);
    ctx.lineTo(cx + w / 2, cy + h * 0.15);
    ctx.lineTo(cx, cy + h / 2);
    ctx.lineTo(cx - w / 2, cy + h * 0.15);
    ctx.closePath();
    ctx.fill();
  }

  function downloadCanvas(canvas, filename) {
    const a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  // 生成图标
  const container = document.getElementById('icons');
  [16, 48, 128].forEach(size => {
    const canvas = drawIcon(size);

    const row = document.createElement('div');
    row.className = 'icon-row';

    // 放大预览
    const previewSize = Math.max(size * 2, 64);
    canvas.style.width = previewSize + 'px';
    canvas.style.height = previewSize + 'px';
    canvas.style.imageRendering = size <= 48 ? 'pixelated' : 'auto';

    const label = document.createElement('div');
    label.innerHTML = `<strong>icon${size}.png</strong><br><span style="color:#999">${size}×${size}px</span>`;

    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '下载';
    btn.onclick = () => downloadCanvas(canvas, `icon${size}.png`);

    row.appendChild(canvas);
    row.appendChild(label);
    row.appendChild(btn);
    container.appendChild(row);
  });

  // 一键全部下载
  const allBtn = document.createElement('button');
  allBtn.className = 'btn';
  allBtn.textContent = '全部下载';
  allBtn.style.marginTop = '10px';
  allBtn.style.fontSize = '15px';
  allBtn.style.padding = '12px 24px';
  allBtn.onclick = () => {
    [16, 48, 128].forEach(size => {
      const canvas = drawIcon(size);
      downloadCanvas(canvas, `icon${size}.png`);
    });
  };
  container.appendChild(allBtn);
  </script>
</body>
</html>
